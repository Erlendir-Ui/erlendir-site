<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erlendirr — Twitch Стример | World of Warcraft</title>
    <style>
        :root {
            --bg-main: #09090b;
            --bg-card: rgba(24, 24, 27, 0.82);
            --bg-hover: rgba(38, 38, 44, 0.95);
            --twitch-purple: #9147ff;
            --twitch-purple-hover: #772ce8;
            --accent-glow: rgba(145, 71, 255, 0.35);
            --text-main: #efeff1;
            --text-muted: #adadb8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            /* Автоматически подхватит файл bg.png */
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(145, 71, 255, 0.22), transparent 60%),
                linear-gradient(to bottom, rgba(9, 9, 11, 0.78), rgba(9, 9, 11, 0.96)),
                url('bg.png');
            background-size: cover;
            background-position: center top;
            background-attachment: fixed;
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 980px;
            width: 100%;
            margin-top: 10px;
        }

        /* Карточка профиля с баннером сверху */
        .profile-card {
            background-color: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 24px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
        }

        .profile-banner {
            height: 180px;
            width: 100%;
            /* Автоматически подхватит файл banner.png */
            background: 
                linear-gradient(135deg, rgba(145, 71, 255, 0.55), rgba(32, 14, 66, 0.85)),
                url('banner.png');
            background-size: cover;
            background-position: center;
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }

        .profile-body {
            padding: 0 30px 30px 30px;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            margin-top: -48px;
            position: relative;
            z-index: 2;
        }

        .profile-left {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 20px;
            max-width: 620px;
        }

        .avatar-wrapper {
            width: 104px;
            height: 104px;
            border-radius: 50%;
            background: linear-gradient(135deg, #9147ff, #3b0d82);
            border: 4px solid #18181b;
            box-shadow: 0 0 20px var(--accent-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: 800;
            color: #fff;
            flex-shrink: 0;
            overflow: hidden;
            position: relative;
        }

        .avatar-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .profile-text {
            padding-top: 54px;
        }

        .title-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 6px;
        }

        h1 {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .badge {
            background-color: rgba(145, 71, 255, 0.25);
            color: #d0b3ff;
            border: 1px solid var(--twitch-purple);
            font-size: 12px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .bio {
            color: var(--text-muted);
            font-size: 15px;
        }

        .btn-twitch {
            background: linear-gradient(135deg, #9147ff, #772ce8);
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            padding: 14px 28px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 20px var(--accent-glow);
            margin-bottom: 4px;
        }

        .btn-twitch:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 26px rgba(145, 71, 255, 0.6);
        }

        /* Блок плеера */
        .player-section {
            background-color: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 24px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .live-dot {
            width: 10px;
            height: 10px;
            background-color: #eb0400;
            border-radius: 50%;
            box-shadow: 0 0 8px #eb0400;
            display: inline-block;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 10px;
            background-color: #000;
            border: 1px solid var(--border-color);
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Карточки ссылок */
        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }

        .social-card {
            background-color: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px 20px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background-color 0.2s, border-color 0.2s, transform 0.15s;
        }

        .social-card:hover {
            background-color: var(--bg-hover);
            border-color: var(--twitch-purple);
            transform: translateY(-2px);
        }

        .social-card span.sub {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 400;
            margin-top: 2px;
        }

        footer {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: auto;
            padding: 20px 0;
            text-align: center;
        }

        @media (max-width: 700px) {
            .profile-banner {
                height: 130px;
            }
            .profile-body {
                flex-direction: column;
                align-items: flex-start;
                margin-top: -42px;
            }
            .profile-text {
                padding-top: 8px;
            }
            .btn-twitch {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

                        <img src="avatar.png" alt="Erlendirr" onerror="this.style.display='none'">
